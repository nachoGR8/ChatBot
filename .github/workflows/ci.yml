name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatbot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Los tests usan un modelo falso: no hace falta llama-cpp-python ni gpt4all.
      - run: pip install fastapi uvicorn python-multipart sqlalchemy pydantic rapidfuzz PyPDF2 python-docx -r backend/requirements-dev.txt
      - run: python -m pytest -q
